<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mumbai Maxxing Admin</title>
  <meta name="theme-color" content="#1E1E1E">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    #login { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
    #login form { width: 100%; max-width: 380px; padding: 24px; display: grid; gap: 14px; }
    #login img { width: 88px; }

    header.top { background: var(--ink); color: var(--white); position: sticky; top: 0; z-index: 10; }
    header.top .row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; flex-wrap: wrap; }
    header.top img { width: 44px; background: var(--paper); border-radius: 10px; padding: 4px; }
    header.top h1 { font-size: 18px; flex: 1; min-width: 160px; }
    header.top h1 span { color: #a5a5a5; font-weight: 400; }
    .tabs { display: flex; gap: 4px; background: #2e2e2e; border-radius: var(--pill); padding: 4px; overflow-x: auto; max-width: 100%; }
    .tabs a { color: #c4c4c4; padding: 8px 14px; border-radius: var(--pill); font-weight: 700; white-space: nowrap; text-decoration: none; flex: none; }
    .tabs .short { display: none; }
    .tabs { scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
    @media (max-width: 760px) {
      header.top .row { gap: 10px; padding: 10px 16px; }
      header.top img { width: 36px; }
      header.top h1 { font-size: 16px; min-width: 0; }
      header.top h1 .role { display: none; }
      .tabs { width: 100%; justify-content: space-between; }
      .tabs { gap: 0; padding: 3px; }
      .tabs a { padding: 8px 9px; font-size: 13px; }
      .tabs .badge { margin-left: 4px; min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; }
      .tabs .long { display: none; }
      .tabs .short { display: inline; }
      .toolbar h2 { flex-basis: 100%; font-size: 26px; }
      .toolbar select.input.sm { flex: 1 1 150px; }
      .toolbar .btn.sm { flex: 1 1 auto; }
    }
    .tabs a.on { background: var(--white); color: var(--ink); }
    .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--orange); color: var(--ink); font-size: 12px; margin-left: 6px; }
    .badge:empty, .badge.zero { display: none; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #777; display: inline-block; vertical-align: middle; margin-left: 6px; }
    .live.on { background: var(--green); box-shadow: 0 0 0 3px rgba(36,203,113,.25); }

    main.wrap { padding-top: 20px; padding-bottom: 60px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar h2 { font-size: 28px; flex: 1; min-width: 160px; }
    .seg { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; background: var(--white); border-radius: var(--pill); padding: 4px; box-shadow: inset 0 0 0 1.5px var(--line); gap: 2px; }
    .seg::-webkit-scrollbar { display: none; }
    .seg button { border: 0; background: transparent; border-radius: var(--pill); padding: 8px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; flex: none; }
    .seg button.on { background: var(--ink); color: var(--white); }
    .seg button .n { opacity: .55; font-weight: 400; margin-left: 4px; }
    select.input.sm { width: auto; max-width: 100%; min-height: 42px; padding: 8px 42px 8px 16px; border-radius: var(--pill); background-position: right 16px center; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { text-align: center; padding: 64px 16px; color: var(--muted); }

    /* Team cards (home) */
    .teamgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
    .tcard { padding: 18px; display: grid; gap: 14px; text-decoration: none; color: inherit; position: relative; transition: transform .12s, box-shadow .12s; border: 2px solid transparent; }
    .tcard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 14px 30px rgba(0,0,0,.08); }
    .tcard.has-pending { border-color: var(--orange); }
    .tcard .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .tcard h3 { font-size: 20px; }
    .tcard .code { font-size: 13px; letter-spacing: .18em; color: var(--muted); font-weight: 700; }
    .tcard .pts { font-size: 16px; padding: 6px 12px; }
    .tcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .avs { display: flex; }
    .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid var(--white); margin-left: -6px; color: var(--ink); }
    .av:first-child { margin-left: 0; }
    .av.av-empty { background: var(--paper); color: #bbb; }
    .bar { height: 8px; background: var(--paper); border-radius: var(--pill); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--blue); border-radius: var(--pill); }
    .review-tag { position: absolute; top: -10px; right: 14px; background: var(--orange); color: var(--ink); font-weight: 700; font-size: 12px; border-radius: var(--pill); padding: 4px 10px; }

    /* Team detail */
    .back { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); text-decoration: none; margin-bottom: 14px; }
    .thead { padding: 22px; display: grid; gap: 18px; grid-template-columns: 1fr auto; margin-bottom: 18px; }
    @media (max-width: 760px) { .thead { grid-template-columns: 1fr; } }
    .namefield { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; border: 1.5px solid transparent; background: transparent; border-radius: 10px; padding: 2px 8px; margin-left: -8px; width: 100%; }
    .namefield:hover, .namefield:focus { border-color: var(--line); background: var(--white); outline: none; }
    .codebig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .codebig b { font-size: 24px; letter-spacing: .2em; }
    .mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border-radius: var(--pill); padding: 4px 6px 4px 4px; margin: 2px 4px 2px 0; font-size: 14px; }
    .mchip .av { margin: 0; width: 26px; height: 26px; border: 0; font-size: 12px; }
    .mchip { padding-right: 4px; }
    .mchip .kick { border: 0; background: var(--white); cursor: pointer; color: var(--maroon); font-size: 12px; font-weight: 700; border-radius: var(--pill); padding: 4px 10px; margin-left: 4px; }
    .mchip .kick:hover { background: #FFE0E0; }
    .media .del-file { position: absolute; top: 6px; right: 6px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s; }
    .media .del-file svg { width: 16px; height: 16px; }
    .media .m:hover .del-file, .media .del-file:focus-visible { opacity: 1; }
    .media .del-file:hover { background: var(--coral); color: var(--ink); }
    @media (hover: none) { .media .del-file { opacity: 1; } }
    .media .pin { position: absolute; right: 6px; bottom: 6px; z-index: 1; font-size: 12px; background: rgba(255,255,255,.9); border-radius: var(--pill); padding: 1px 5px; }
    .cap { font-size: 13px; margin-top: -4px; }
    .cap a { color: var(--blue); font-weight: 700; text-decoration: none; }
    .cap a:hover { text-decoration: underline; }
    .cap.none { color: #9a3a10; }
    .lb-cap { color: #fff; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; align-self: end; padding: 56px 8px 10px; text-align: center; }
    .lb-cap a { color: var(--lime); font-weight: 700; }
    .lb-cap .muted { color: #aaa; }
    .lightbox img, .lightbox video { max-height: 76vh !important; }
    .sub-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: -2px; }
    .dlg-scrim { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
    .dlg { max-width: 440px; width: 100%; padding: 22px; display: grid; gap: 10px; }
    .dlg h3 { font-size: 20px; }
    .dlg p { margin: 0; color: #444; }
    .dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .scorebox { text-align: right; display: grid; align-content: start; gap: 8px; justify-items: end; }
    @media (max-width: 760px) { .scorebox { text-align: left; justify-items: start; } }
    .scorebox .big { font-size: 56px; font-weight: 700; line-height: .9; letter-spacing: -0.04em; }

    .tasklist { display: grid; gap: 10px; }
    .trow { overflow: hidden; }
    .trow > .sum { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
    .trow > .sum:hover { background: #fafafa; }
    @media (max-width: 640px) {
      .trow > .sum { grid-template-columns: 32px 1fr auto; row-gap: 8px; }
      .trow > .sum > :nth-child(3) { grid-column: 2 / 3; grid-row: 2; }
      .trow > .sum .chev { grid-row: 1; grid-column: 3; }
    }
    .trow .num { color: var(--muted); font-weight: 700; }
    .trow .tt b { display: block; font-size: 16px; }
    .trow .chev { transition: transform .15s; color: var(--muted); }
    .trow.open .chev { transform: rotate(90deg); }
    .trow.st-pending-row { box-shadow: inset 4px 0 0 var(--orange), var(--shadow); }
    .trow .body { border-top: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; background: #fcfcfc; }
    .attempts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start; }

    /* Submission card (shared) */
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
    .sub { padding: 16px; display: grid; gap: 12px; }
    .sub .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .sub h3 { font-size: 18px; }
    .sub .team { font-weight: 700; color: var(--blue); text-decoration: none; }
    .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .media .m { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #ddd; cursor: zoom-in; }
    .media .m img, .media .m video { width: 100%; height: 100%; object-fit: cover; }
    .media .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; border-radius: var(--pill); padding: 2px 8px; }
    .note { background: var(--paper); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .reviewed { border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .reviewed.approved { background: #D3F5E2; color: #0d6b3a; }
    .reviewed.rejected { background: #FFE0E0; color: var(--maroon); }

    /* Leaderboard / tasks / settings */
    .lbrow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; text-decoration: none; color: inherit; }
    .lbrow:hover { background: #fafafa; }
    .lbrow .rank { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-weight: 700; }
    .lbrow:nth-child(1) .rank { background: var(--lime); }
    .lbrow:nth-child(2) .rank { background: #C9C8FF; }
    .lbrow:nth-child(3) .rank { background: #FFD3C2; }
    .lbrow .name { flex: 1; font-weight: 700; font-size: 18px; }
    .taskrow { display: grid; grid-template-columns: 36px minmax(0,1fr) minmax(0,2fr) 84px 150px; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .taskrow .acts { justify-content: flex-end; }
    .taskrow .save { display: none; }
    .taskrow.dirty .save { display: inline-flex; }
    .taskrow.dirty { background: #FAFAFF; }
    .danger-ghost { background: transparent; color: var(--maroon); box-shadow: inset 0 0 0 1.5px var(--coral); }
    .danger-ghost:hover { background: #FFE0E0; }
    .danger-ghost svg, .card-del svg { width: 15px; height: 15px; }
    .foot-r { display: inline-flex; align-items: center; gap: 6px; }
    .card-del { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: #b3b3b3; display: grid; place-items: center; cursor: pointer; }
    .card-del:hover, .card-del:focus-visible { background: #FFE0E0; color: var(--maroon); }
    .del-btn { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; padding: 8px; border-radius: 8px; }
    .del-btn:hover { color: var(--maroon); background: #FFE0E0; }
    @media (max-width: 760px) {
      .taskrow { grid-template-columns: 28px minmax(0,1fr) 76px; }
      .taskrow > :nth-child(2) { grid-column: 2; grid-row: 1; }
      .taskrow > :nth-child(4) { grid-column: 3; grid-row: 1; }
      .taskrow > :nth-child(3) { grid-column: 2 / -1; grid-row: 2; }
      .taskrow > :nth-child(5) { grid-column: 2 / -1; grid-row: 3; justify-content: flex-start; }
    }
    .taskrow .input { min-height: 40px; padding: 8px 12px; border-radius: 10px; }
    .acts { display: flex; gap: 6px; }
    .setting { display: flex; align-items: center; gap: 16px; padding: 18px; }
    .setting > div { flex: 1; }
    .switch { position: relative; width: 52px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: #cfcfcf; border-radius: 15px; transition: .2s; cursor: pointer; }
    .switch span::before { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + span { background: var(--blue); }
    .switch input:checked + span::before { transform: translateX(22px); }

    #printSheet { display: none; }
    @media print {
      body > *:not(#printSheet) { display: none !important; }
      #printSheet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .pcard { border: 2px solid #1E1E1E; border-radius: 16px; padding: 16px; break-inside: avoid; }
      .pcard b { font-size: 30px; letter-spacing: .2em; display: block; }
    }
  </style>
</head>
<body>
  <div id="toasts"></div>

  <section id="login" class="hidden">
    <form id="loginForm" class="card">
      <img src="/img/logo.png" alt="FoF Mumbai">
      <h2 style="font-size:28px">Organiser login</h2>
      <p class="muted" style="margin:0">Mumbai Maxxing review dashboard</p>
      <input id="pw" class="input" type="password" placeholder="Admin password" autocomplete="current-password" required>
      <div id="loginErr" class="small" style="color:var(--maroon)"></div>
      <button class="btn blue block">Log in</button>
    </form>
  </section>

  <section id="dash" class="hidden">
    <header class="top">
      <div class="wrap row">
        <img src="/img/logo.png" alt="FoF Mumbai">
        <h1>Mumbai Maxxing <span class="role">· Organiser</span><span class="live" id="live" title="Live updates"></span></h1>
        <nav class="tabs">
          <a href="#/teams" data-tab="teams">Teams</a>
          <a href="#/queue" data-tab="queue">Review<span class="long"> queue</span><span class="badge" id="pendingBadge"></span></a>
          <a href="#/board" data-tab="board"><span class="long">Leaderboard</span><span class="short">Board</span></a>
          <a href="#/tasks" data-tab="tasks">Tasks</a>
          <a href="#/settings" data-tab="settings">Settings</a>
        </nav>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </section>

  <div id="printSheet"></div>
  <script src="/admin.js"></script>
</body>
</html>
