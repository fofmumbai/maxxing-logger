<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mumbai Maxxing</title>
  <meta name="description" content="Mumbai Maxxing task logger by Friends of Figma Mumbai">
  <meta name="theme-color" content="#F5F5F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mumbai Maxxing">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/logo.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/Figma-Sans-Text-Bold.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

    /* Join */
    #join { min-height: 100dvh; display: grid; align-content: center; gap: 28px; padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b)); position: relative; }
    #join > * { position: relative; z-index: 1; }
    #join .shapes { position: fixed; top: 0; right: 0; width: min(46vw, 260px); z-index: 0; pointer-events: none; }
    @media (min-width: 700px) { #join .shapes { width: 320px; } }
    #join .logo { width: 104px; }
    .hero h1 { font-size: clamp(40px, 12vw, 64px); font-weight: 700; }
    .hero h1 .hl { background: var(--lime); border-radius: var(--pill); padding: 0 .25em; }
    .hero p { margin: 12px 0 0; color: var(--muted); }
    #codeInput { text-transform: uppercase; letter-spacing: .25em; font-weight: 700; font-size: 22px; text-align: center; }
    .err { color: var(--maroon); background: #FFE0E0; border-radius: 12px; padding: 10px 14px; font-size: 14px; }

    /* Header */
    header.top { position: sticky; top: 0; z-index: 10; background: rgba(245,245,245,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding-top: var(--safe-t); }
    header.top .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    header.top .logo { width: 44px; }
    header.top .team { flex: 1; min-width: 0; }
    header.top .team b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { text-align: right; }
    .score b { font-size: 28px; line-height: 1; display: block; letter-spacing: -0.03em; }
    .prog-row { display: flex; align-items: center; gap: 10px; }
    .prog-row .muted { font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .progress { flex: 1; height: 8px; background: var(--white); border-radius: var(--pill); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
    .progress i { display: block; height: 100%; background: var(--blue); border-radius: var(--pill); transition: width .4s; }
    .chips { gap: 8px; padding: 12px 0; margin-right: -16px; padding-right: 16px; }
    .chip { border: 0; background: var(--white); border-radius: var(--pill); padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
    .chip.on { background: var(--ink); color: var(--white); box-shadow: none; }
    .chip .n { opacity: .6; margin-left: 4px; font-weight: 400; }

    main.wrap { padding-bottom: calc(110px + var(--safe-b)); }
    .tasks { display: grid; gap: 10px; padding-top: 4px; }
    .tasks { gap: 8px; }
    .task { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; text-align: left; width: 100%; cursor: pointer; border-radius: 14px; }
    .task:active { transform: scale(.99); }
    .task h3 { font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .task .sub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    .task .pts { font-size: 14px; padding: 5px 11px; }
    .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
    .ic svg { width: 16px; height: 16px; }
    .ic.todo { box-shadow: inset 0 0 0 2px var(--line); }
    .ic.pending { background: #FFE6DA; color: #b4460f; }
    .ic.approved { background: var(--green); color: var(--ink); }
    .ic.rejected { background: var(--coral); color: var(--ink); }
    .task.approved { background: #F4FBF7; }
    .task.approved h3 { color: #3f5b4b; }
    .task.approved .pts { background: #D3F5E2; color: #0d6b3a; }
    .task .sub.pending { color: #b4460f; } .task .sub.rejected { color: var(--maroon); } .task .sub.approved { color: #0d6b3a; }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }

    /* Bottom nav */
    nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + var(--safe-b)); background: linear-gradient(to top, var(--paper) 70%, rgba(245,245,245,0)); }
    nav.bottom .bar { max-width: 560px; margin: 0 auto; display: flex; background: var(--ink); border-radius: var(--pill); padding: 6px; gap: 4px; }
    nav.bottom button { flex: 1; border: 0; background: transparent; color: #bdbdbd; border-radius: var(--pill); padding: 10px 4px; font-weight: 700; font-size: 14px; cursor: pointer; position: relative; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; min-width: 0; }
    nav.bottom button.on { background: var(--white); color: var(--ink); }
    nav.bottom .dot { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: var(--ink); font-size: 11px; padding: 0 5px; margin-left: 5px; vertical-align: 1px; }

    /* Sheet */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92dvh; overflow-y: auto; background: var(--paper); border-radius: 24px 24px 0 0; padding: 8px 16px calc(20px + var(--safe-b)); animation: up .25s ease; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet .inner { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
    .grab { width: 40px; height: 5px; border-radius: 3px; background: #cfcfcf; margin: 4px auto 4px; }
    .sheet h2 { font-size: 26px; }
    .sheet .head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .sheet .head .pills { display: flex; gap: 8px; align-items: center; }
    .sheet .head .pts { font-size: 14px; }
    .x-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #e6e6e6; color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
    .x-btn svg { width: 18px; height: 18px; }
    .sheet .desc { margin: -6px 0 0; color: #444; }
    .capture { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .capture .btn { min-height: 64px; border-radius: 20px; flex-direction: column; gap: 4px; font-size: 15px; }
    .capture svg { width: 24px; height: 24px; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .thumb { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #ddd; }
    .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
    .thumb .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 16px; cursor: pointer; }
    .thumb .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; border-radius: var(--pill); padding: 2px 8px; z-index: 2; }
    .thumb .x { z-index: 3; }
    .thumb .ov { position: absolute; inset: 0; pointer-events: none; }
    .thumb .ov > * { pointer-events: auto; }
    .thumb .up { position: absolute; inset: 0; background: rgba(30,30,30,.55); color: #fff; display: grid; place-items: center; align-content: center; gap: 8px; padding: 0 14px; }
    .thumb .up b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .upline { display: block; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
    .upline i { display: block; height: 100%; background: var(--lime); border-radius: 3px; transition: width .2s; }
    .thumb .up.err { border: 0; background: rgba(255,118,118,.88); color: var(--ink); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; width: 100%; }
    .thumb .up.err b { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--coral); display: grid; place-items: center; font-size: 16px; }
    .thumb .ok { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: var(--ink); font-weight: 700; display: grid; place-items: center; font-size: 14px; z-index: 2; animation: pop .3s ease; }
    @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.2); } }

    /* Confirmation popup */
    .dlg-scrim { position: fixed; inset: 0; z-index: 85; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 20px; animation: fade .15s; }
    .dlg { background: var(--white); border-radius: 24px; padding: 22px; max-width: 380px; width: 100%; display: grid; gap: 10px; animation: up .2s ease; }
    .dlg h3 { font-size: 20px; }
    .dlg p { margin: 0; color: #444; }
    .dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

    /* Done popup */
    .done-pop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 24px; animation: fade .2s; }
    .done-card { background: var(--white); border-radius: 28px; padding: 28px 22px 20px; max-width: 360px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; animation: up .3s ease; }
    .done-card h2 { font-size: 30px; }
    .done-card p { margin: 0 0 6px; color: var(--muted); }
    .done-card p b { color: var(--ink); }
    .done-check { width: 84px; height: 84px; border-radius: 50%; background: var(--green); color: var(--ink); font-size: 44px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 10px var(--lime); animation: pop .4s ease; }
    .feedback { border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
    .feedback.rejected { background: #FFE0E0; color: var(--maroon); }
    .feedback.approved { background: #D3F5E2; color: #0d6b3a; }
    .feedback.pending { background: #FFE6DA; color: #9a3a10; }
    .upbar { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; width: 100%; }
    .upbar i { display: block; height: 100%; background: var(--lime); width: 0; transition: width .2s; }
    #sendBtn .upbar { background: rgba(0,0,0,.12); max-width: 220px; }
    #sendBtn .upbar i { background: var(--ink); }

    /* Updates */
    .update { padding: 14px 16px; display: grid; gap: 6px; }
    .update .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .update .meta b { display: flex; align-items: center; gap: 8px; }
    .update.unread .meta b::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
    .section-title { font-size: 28px; padding: 16px 0 12px; }

    /* Team */
    .member { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
    .codebox { padding: 20px; display: grid; gap: 6px; text-align: center; background: var(--ink); color: var(--white); }
    .codebox b { font-size: 34px; letter-spacing: .25em; }

    /* In-app camera */
    .cam { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; display: grid; grid-template-rows: auto 1fr auto; }
    .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cam video.mirror { transform: scaleX(-1); }
    .cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .cam-flash.on { opacity: .8; transition: none; }
    .cam-top, .cam-bottom { position: relative; z-index: 2; }
    .cam-top { display: flex; justify-content: space-between; align-items: center; padding: calc(12px + var(--safe-t)) 16px 12px; background: linear-gradient(rgba(0,0,0,.5), transparent); }
    .cam-ic { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .cam-ic svg { width: 22px; height: 22px; }
    .cam-ic:disabled { opacity: .35; }
    .cam-rec { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,.55); border-radius: var(--pill); padding: 6px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cam-rec i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .cam-msg { position: relative; z-index: 2; align-self: center; justify-self: center; max-width: 320px; margin: 0 16px; text-align: center; background: rgba(30,30,30,.92); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
    .cam-bottom { grid-row: 3; padding: 12px 16px calc(20px + var(--safe-b)); background: linear-gradient(transparent, rgba(0,0,0,.6)); display: grid; gap: 14px; }
    .cam-modes { justify-self: center; display: flex; gap: 4px; background: rgba(0,0,0,.45); border-radius: var(--pill); padding: 4px; }
    .cam-modes button { border: 0; background: transparent; color: #ddd; font-weight: 700; padding: 8px 18px; border-radius: var(--pill); cursor: pointer; }
    .cam-modes button.on { background: var(--lime); color: var(--ink); }
    .cam-modes button:disabled { opacity: .4; }
    .cam-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .cam-last { justify-self: start; width: 52px; height: 52px; position: relative; }
    .cam-last .media { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.12); box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
    .cam-last img, .cam-last video { width: 100%; height: 100%; object-fit: cover; }
    .cam-last b { position: absolute; top: -8px; right: -8px; z-index: 1; background: var(--blue); color: #fff; font-size: 12px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px #000; }
    .cam-last:empty { visibility: hidden; }
    .shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 5px; cursor: pointer; }
    .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .2s; }
    .shutter:active span { transform: scale(.9); }
    .cam.video .shutter span { background: var(--coral); }
    .cam.recording .shutter span { border-radius: 8px; transform: scale(.5); }
    .shutter:disabled { opacity: .4; }
    .cam-done { justify-self: end; border: 0; background: var(--lime); color: var(--ink); font-weight: 700; border-radius: var(--pill); padding: 12px 18px; cursor: pointer; }

    /* Leaderboard */
    .lb { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .lb .rank { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--paper); }
    .lb.me { background: var(--lime); }
    .lb:nth-child(1) .rank { background: var(--ink); color: var(--lime); }
    .lb:nth-child(2) .rank { background: var(--blue); color: #fff; }
    .lb:nth-child(3) .rank { background: var(--coral); color: var(--ink); }
    .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 14px; cursor: pointer; padding: 12px; justify-self: center; }
    .lb .name { flex: 1; font-weight: 700; }
  </style>
</head>
<body>
  <div id="toasts"></div>

  <!-- JOIN -->
  <section id="join" class="wrap hidden">
    <svg class="shapes" viewBox="0 0 260 300" aria-hidden="true">
      <path d="M150 -10h140v150a70 70 0 0 1-140 0z" fill="#FF7676"/>
      <rect x="120" y="150" width="120" height="120" rx="14" transform="rotate(-18 180 210)" fill="#24CB71"/>
      <circle cx="96" cy="60" r="34" fill="#4D49FC"/>
      <circle cx="228" cy="262" r="20" fill="#E4FF97"/>
    </svg>
    <img class="logo" src="/img/logo.png" alt="Friends of Figma Mumbai">
    <div class="hero">
      <h1>Mumbai <span class="hl">Maxxing</span></h1>
      <p>Join your team with the room code from your organiser. Max 4 members per team.</p>
    </div>
    <form id="joinForm" class="card" style="padding:20px; display:grid; gap:14px;">
      <div class="field">
        <label for="codeInput">Room code</label>
        <input id="codeInput" class="input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="ABC123" required>
      </div>
      <div class="field">
        <label for="nameInput">Your name</label>
        <input id="nameInput" class="input" autocomplete="given-name" maxlength="40" placeholder="e.g. Priya" required>
      </div>
      <div id="joinErr" class="err hidden"></div>
      <button class="btn blue block" type="submit">Join team</button>
    </form>
    <p class="muted small" style="text-align:center; margin:0">Friends of Figma Mumbai · Creativity. Collaboration. Continuous Learning.</p>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <header class="top">
      <div class="wrap">
        <div class="row">
          <img class="logo" src="/img/logo.png" alt="FoF Mumbai">
          <div class="team">
            <span class="muted small">Mumbai Maxxing</span>
            <b id="teamName">—</b>
          </div>
          <div class="score"><b id="teamPoints">0</b><span class="muted small">points</span></div>
        </div>
        <div class="prog-row"><div class="progress"><i id="progressBar" style="width:0"></i></div><span class="muted" id="progressLabel"></span></div>
        <div id="filterChips" class="chips scroll-x fade-x"></div>
      </div>
    </header>

    <main class="wrap">
      <div id="tab-tasks"><div id="taskList" class="tasks"></div></div>
      <div id="tab-updates" class="hidden"><h2 class="section-title">Updates</h2><div id="updateList" class="tasks"></div></div>
      <div id="tab-team" class="hidden"><h2 class="section-title">Your team</h2><div id="teamView" style="display:grid; gap:12px"></div></div>
      <div id="tab-board" class="hidden"><h2 class="section-title">Leaderboard</h2><div id="boardList" class="tasks"></div></div>
    </main>

    <nav class="bottom">
      <div class="bar">
        <button data-tab="tasks" class="on">Tasks</button>
        <button data-tab="updates">Updates<span id="unreadDot" class="dot hidden"></span></button>
        <button data-tab="board" id="boardBtn" class="hidden">Board</button>
        <button data-tab="team">Team</button>
      </div>
    </nav>
  </section>

  <!-- In-app camera: live viewfinder via getUserMedia. There is no file input anywhere, so the gallery can't be used. -->
  <div id="cam" class="cam hidden" role="dialog" aria-modal="true" aria-label="Camera">
    <video id="camView" autoplay playsinline muted></video>
    <div class="cam-flash" id="camFlash"></div>
    <div class="cam-top">
      <button class="cam-ic" id="camClose" aria-label="Close camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="cam-rec hidden" id="camRec"><i></i><span id="camTime">0:00</span></span>
      <button class="cam-ic" id="camFlip" aria-label="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9.5 12.5a2.5 2.5 0 0 1 4.3-1.7M14.5 13.5a2.5 2.5 0 0 1-4.3 1.7"/><path d="M14 9.5v1.5h-1.5M10 16.5V15h1.5"/></svg></button>
    </div>
    <div class="cam-msg hidden" id="camMsg"></div>
    <div class="cam-bottom">
      <div class="cam-modes">
        <button data-mode="photo" class="on">Photo</button>
        <button data-mode="video">Video</button>
      </div>
      <div class="cam-row">
        <div class="cam-last" id="camLast"></div>
        <button class="shutter" id="camShutter" aria-label="Capture"><span></span></button>
        <button class="cam-done" id="camDone">Done</button>
      </div>
    </div>
  </div>

  <div id="sheetHost"></div>
  <script src="/app.js"></script>
</body>
</html>
